name: Quality
on:
  push:
    branches: [main, feat/research-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.8
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/run_foundation.py
      - run: uv run python scripts/execute_notebooks.py
