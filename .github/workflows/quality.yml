name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  final-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12.13'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Test every retained component and invalid-input contract
        run: uv run pytest -q
      - name: Recompute the final evidence and public example
        run: |
          uv run python scripts/verify_final_sprint.py
          uv run python scripts/verify_portfolio_review.py
          uv run python examples/run_demo.py
      - name: Re-execute both final aggregate notebooks with a clean kernel
        run: uv run python scripts/execute_portfolio_review.py
      - name: Exercise bounded official-engine observation contracts
        run: uv run python scripts/run_foundation.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-evaluation-notebooks
          path: artifacts/portfolio-review/*.ipynb
          if-no-files-found: error
          retention-days: 14
