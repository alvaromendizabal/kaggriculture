name: Quality
on:
  push:
    branches: [main, feat/research-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.8
      - run: uv sync --frozen
      - name: Verify frozen public research snapshot
        run: uv run python scripts/verify_publication_snapshot.py
      - name: Verify final-sprint evidence
        run: uv run python scripts/verify_final_sprint.py
      - name: Verify saved employer-review evidence
        run: uv run python scripts/verify_portfolio_review.py
      - name: Exercise the synthetic paired-evaluation example
        run: uv run python examples/run_demo.py
      - name: Execute and reopen aggregate review notebooks
        run: uv run python scripts/execute_portfolio_review.py
      - name: Preserve executed aggregate review notebooks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-review-notebooks
          path: artifacts/portfolio-review/*.ipynb
          if-no-files-found: error
          retention-days: 30
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Verify published staffing audit without running games
        if: ${{ hashFiles('reports/staffing_audit_summary.json') != '' }}
        run: uv run python scripts/verify_staffing_audit.py
      - name: Verify published terminal notebook before new execution
        if: ${{ hashFiles('reports/terminal_notebook_execution.json') != '' }}
        run: uv run python scripts/verify_terminal_notebook.py
      - run: uv run pytest -q
      - run: uv run python scripts/run_foundation.py
      - run: uv run python scripts/execute_notebooks.py
      - run: uv run python scripts/verify_supply_notebook.py --record
      - run: uv run python scripts/verify_research_report.py
      - run: uv run python scripts/verify_market_history.py
      - run: uv run python scripts/verify_supply_report.py
      - run: uv run python scripts/verify_livestock_report.py
      - run: uv run python scripts/verify_terminal_report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: executed-notebooks-${{ github.sha }}
          path: |
            notebooks/02_feature_research.ipynb
            reports/supply_notebook_execution.json
            reports/livestock_notebook_execution.json
            reports/terminal_notebook_execution.json
          if-no-files-found: error
          retention-days: 30
