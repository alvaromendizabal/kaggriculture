name: Publish bottleneck feature research
on:
  push:
    branches: [research/decision-bottlenecks]
permissions:
  contents: write
concurrency:
  group: bottleneck-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      BRANCH: research/decision-bottlenecks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.8
      - run: uv sync --frozen
      - name: Format and test new features and measured byte receipts
        run: |
          uv run ruff format src/kaggriculture_runtime/bottlenecks.py scripts/research_bottlenecks.py tests/test_bottleneck*.py scripts/build_bottleneck_notebook.py
          uv run ruff check --fix src/kaggriculture_runtime/bottlenecks.py scripts/research_bottlenecks.py tests/test_bottleneck*.py scripts/build_bottleneck_notebook.py
          uv run pytest -q tests/test_runtime_assignment.py tests/test_bottleneck*.py
      - name: Execute measured evidence notebook
        if: ${{ hashFiles('reports/bottleneck_research.json') != '' }}
        run: uv run python scripts/build_bottleneck_notebook.py
      - name: Commit generated source and genuine notebook outputs
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kaggriculture_runtime/bottlenecks.py scripts/research_bottlenecks.py tests/test_bottleneck*.py scripts/build_bottleneck_notebook.py
          if test -f notebooks/04_decision_bottlenecks.ipynb; then
            git add notebooks/04_decision_bottlenecks.ipynb reports/bottleneck_notebook_execution.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested bottleneck feature artifacts"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
