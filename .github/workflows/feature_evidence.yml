name: Feature evidence acceptance
on:
  push:
    branches: [research/feature-evidence-acceptance]
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.8
      - run: uv sync --frozen
      - name: Verify evidence and legal workforce coverage
        run: |
          uv run ruff check --fix scripts/verify_bottleneck_notebook.py tests/test_bottleneck_notebook.py scripts/audit_workforce_scope.py tests/test_workforce_scope.py
          uv run ruff format scripts/verify_bottleneck_notebook.py tests/test_bottleneck_notebook.py scripts/audit_workforce_scope.py tests/test_workforce_scope.py
          uv run pytest -q tests/test_bottleneck_notebook.py tests/test_bottleneck_report.py tests/test_workforce_scope.py
          uv run python scripts/verify_bottleneck_notebook.py
          timeout 30s uv run python scripts/audit_workforce_scope.py --record
      - name: Commit tested source and measured mechanics report only
        run: |
          git fetch origin research/feature-evidence-acceptance
          test "$(git rev-parse origin/research/feature-evidence-acceptance)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_bottleneck_notebook.py tests/test_bottleneck_notebook.py scripts/audit_workforce_scope.py tests/test_workforce_scope.py reports/workforce_scope_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified pinned-engine workforce coverage gap'
            git push origin HEAD:refs/heads/research/feature-evidence-acceptance
          fi
